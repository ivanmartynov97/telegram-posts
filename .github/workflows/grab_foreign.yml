name: Grab Foreign Posts

on:
  schedule:
    - cron: '0 */2 * * *'   # каждые 2 часа
  workflow_dispatch: {}       # можно запускать вручную из вкладки Actions на GitHub

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon

      - name: Restore Telethon session
        run: echo "${{ secrets.TG_SESSION_B64 }}" | base64 -d > tg_user_session.session

      - name: Write config.json
        run: |
          cat > config.json << 'EOF'
          {
            "github_token": "${{ secrets.GITHUB_TOKEN }}",
            "github_repo": "${{ github.repository }}"
          }
          EOF

      - name: Run grab_foreign.py
        run: python3 grab_foreign.py
